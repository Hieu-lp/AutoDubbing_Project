name: autodubbing-team

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Chua cau hinh SQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  api:
    image: autodubbing-api:dev
    pull_policy: never
    env_file:
      - path: ./.env.api.team
        format: raw
    environment:
      DOTNET_ENVIRONMENT: "Development"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Jwt__Issuer: "AutoDubbing.API"
      Jwt__Audience: "AutoDubbing.Admin"
      Jwt__LifetimeMinutes: "30"
      ContentPreparation__AcceptNewGeneration: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - api-audio-cache:/app/artifacts/audio-cache
    restart: unless-stopped

  user-web:
    image: autodubbing-user-web:dev
    pull_policy: never
    build:
      context: .
      dockerfile: fe-user-web/Dockerfile.team
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:18081:80"
    restart: unless-stopped

volumes:
  sqlserver-data:
  api-audio-cache:
