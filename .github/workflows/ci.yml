name: .NET CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - backend-api
      - frontend-user-web
      - frontend-admin-dashboard

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Cài đặt .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kiểm tra biên dịch backend
        run: dotnet build AutoDubbingSystem.slnx --configuration Release

      - name: Chạy kiểm thử backend trên database tách biệt
        run: dotnet test AutoDubbing.Tests/AutoDubbing.Tests.csproj --configuration Release --no-build --no-restore

      - name: Kiểm tra đóng gói Docker
        run: docker build -t autodubbing-api .

  publish-images:
    name: Publish Docker images to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Tải mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/hieu-lp/autodubbing-api:develop

      - name: Build và publish User Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./fe-user-web/Dockerfile.team
          push: true
          tags: ghcr.io/hieu-lp/autodubbing-user-web:develop
