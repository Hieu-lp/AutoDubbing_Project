name: .NET CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - backend-api
      - frontend-user-web
      - frontend-admin-dashboard

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Cài đặt .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kiểm tra biên dịch backend
        run: dotnet build

      - name: Kiểm tra đóng gói Docker
        run: docker build -t autodubbing-api .